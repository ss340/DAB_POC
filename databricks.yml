# This is a Databricks asset bundle definition for dab_project1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project1
  uuid: 437fe451-4741-445e-8f43-eacd21b74684

include:
  - resources/*.yml
  - resources/*/*.yml
  - clusters/dab_clusters.yml
variables:
   dab_notebook:
        description: this is my dab notebook
        default: ../notebooks/hello.ipynb

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-5617320958565588.8.azuredatabricks.net
    
    presets:
      # Set dynamic_version: true on all artifacts of type "whl".
      # This makes "bundle deploy" add a timestamp to wheel's version before uploading,
      # new wheel takes over the previous installation even if actual wheel version is unchanged.
      # See https://docs.databricks.com/aws/en/dev-tools/bundles/settings
      artifacts_dynamic_version: true

  prod:
    mode: production
    workspace:
      host: https://adb-5617320958565588.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shivangi.s12@tcs.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shivangi.s12@tcs.com/.bundle/${bundle.name}/${bundle.target}
      #root_path: ${workspace.current_user.short_name}
      #root_path: /${workspace.host}
    permissions:
      - user_name: shivangi.s12@tcs.com
        level: CAN_MANAGE

    variables:
      dab_notebook: ../notebooks/hello2.ipynb    
