# The main job for dab_project1.
resources:
  jobs:
    dab_project1_job:
      name: dab_project1_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:
        - task_key: notebook_task
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ${var.dab_notebook}
            base_parameters:
                notebook_param: "param12"
      # tasks:
      #   - task_key: notebook_task_2
      #     job_cluster_key: job_cluster_2
      #     notebook_task:
      #       notebook_path: ${var.dab_notebook}

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster: ${var.dab_cluster_task1}
        # - job_cluster_key: job_cluster_2
        #   new_cluster: ${var.dab_cluster_task2}